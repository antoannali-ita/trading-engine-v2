name: Orchestrator CI

on:
  pull_request:
    paths:
      - 'orchestrator/**'
      - 'monitor/fast_monitor.py'
      - 'tests/test_orchestrator_confluence.py'
      - '.github/workflows/ci_orchestrator.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_orchestrator_confluence.py
      - run: python -m compileall -q orchestrator monitor/fast_monitor.py
