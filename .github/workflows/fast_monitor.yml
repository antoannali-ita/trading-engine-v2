name: Fast Monitor v2

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        required: true
        type: choice
        options: [usa, italy, both]
        default: both
      request_id:
        description: Optional manual_run_requests UUID
        required: false
        type: string
  schedule:
    # ITALIA: ogni 15 minuti nella finestra che copre 09:00-17:30 Europe/Rome.
    - cron: '*/15 7-16 * * 1-5'
    # USA: ogni 15 minuti nella finestra che copre 09:30-16:00 America/New_York.
    - cron: '*/15 13-21 * * 1-5'

concurrency:
  group: fast-monitor-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  italy:
    name: Fast Monitor ITALY
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '*/15 7-16 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.market == 'italy' || github.event.inputs.market == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: v2-core-runtime-${{ runner.os }}-${{ github.run_id }}-italy
          restore-keys: |
            v2-core-runtime-${{ runner.os }}-
            v2-parity-${{ runner.os }}-
            v2-fast-italy-${{ runner.os }}-
      - name: Heartbeat start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log start --module FAST_MONITOR_ITALY --component italy --market ITALY
      - name: Run Fast Monitor ITALY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL || '35000' }}
          PORTFOLIO_POSITIONS_JSON: ${{ secrets.PORTFOLIO_POSITIONS_JSON }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m monitor.fast_monitor --market italy
      - name: Heartbeat finish
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log finish --module FAST_MONITOR_ITALY --component italy --market ITALY --status "${{ job.status }}"

  usa:
    name: Fast Monitor USA
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '*/15 13-21 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.market == 'usa' || github.event.inputs.market == 'both'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: v2-core-runtime-${{ runner.os }}-${{ github.run_id }}-usa
          restore-keys: |
            v2-core-runtime-${{ runner.os }}-
            v2-parity-${{ runner.os }}-
            v2-fast-usa-${{ runner.os }}-
      - name: Heartbeat start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log start --module FAST_MONITOR_USA --component usa --market USA
      - name: Run Fast Monitor USA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL || '35000' }}
          PORTFOLIO_POSITIONS_JSON: ${{ secrets.PORTFOLIO_POSITIONS_JSON }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m monitor.fast_monitor --market usa
      - name: Heartbeat finish
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log finish --module FAST_MONITOR_USA --component usa --market USA --status "${{ job.status }}"
