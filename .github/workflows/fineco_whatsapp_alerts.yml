name: Fineco WhatsApp Alerts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fineco_whatsapp_alerts.yml"
  workflow_run:
    workflows:
      - "Fast Monitor v2"
      - "Trading Engine V2 Orchestrator"
    types: [completed]
  schedule:
    # Cron primario, spostato dai minuti tondi per ridurre la congestione GitHub.
    # Il workflow_run sopra e' un secondo canale di wake-up: non modifica i workflow
    # sorgente, si limita ad ascoltarne il completamento.
    - cron: "7,17,27,37,47,57 6-22 * * 1-5"

permissions:
  contents: read

# Una sola lettura IMAP alla volta. Se cron e workflow_run coincidono,
# il secondo run attende e BODY.PEEK/Seen impedisce doppi invii.
concurrency:
  group: fineco-whatsapp-alerts
  cancel-in-progress: false

jobs:
  fineco-alerts:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Italian market alert window
        id: window
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          DAY=$(TZ=Europe/Rome date +%u)
          if [ "$DAY" -ge 1 ] && [ "$DAY" -le 5 ] && [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 23 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dentro fascia Italia: $(TZ=Europe/Rome date)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fuori fascia Italia: $(TZ=Europe/Rome date)"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Fineco bridge dependencies
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: python -m pip install --disable-pip-version-check "tradingview-screener>=3.0"

      - name: Read Fineco alerts, enrich with TradingView and send WhatsApp
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FINECO_SENDER: service@finecobank.com
          FINECO_SUBJECT: Alert da FinecoBank
          FINECO_LABEL: BANCHE
        run: python -m fineco_alert_bridge.runner
