name: Fineco WhatsApp Alerts

on:
  workflow_dispatch:
  schedule:
    # Ogni 30 minuti nella finestra UTC che copre le sessioni ITALIA + USA.
    - cron: '*/30 7-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: fineco-whatsapp-alerts
  cancel-in-progress: true

jobs:
  fineco-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check regular market window
        id: window
        shell: bash
        run: |
          IT_DAY=$(TZ=Europe/Rome date +%u)
          IT_HM=$(TZ=Europe/Rome date +%H%M)
          US_DAY=$(TZ=America/New_York date +%u)
          US_HM=$(TZ=America/New_York date +%H%M)
          IT_OPEN=false
          US_OPEN=false
          if [ "$IT_DAY" -ge 1 ] && [ "$IT_DAY" -le 5 ] && [ "$IT_HM" -ge 0900 ] && [ "$IT_HM" -le 1730 ]; then IT_OPEN=true; fi
          if [ "$US_DAY" -ge 1 ] && [ "$US_DAY" -le 5 ] && [ "$US_HM" -ge 0930 ] && [ "$US_HM" -le 1600 ]; then US_OPEN=true; fi
          if [ "$IT_OPEN" = true ] || [ "$US_OPEN" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Sessione regolare aperta: IT=$IT_OPEN USA=$US_OPEN"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Entrambi i mercati fuori sessione regolare"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Fineco bridge dependencies
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check 'tradingview-screener>=3.0'

      - name: Heartbeat start
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log start --module FINECO_BRIDGE --component gmail-tradingview-whatsapp

      - name: Read Fineco alerts, enrich with TradingView and send WhatsApp
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FINECO_SENDER: service@finecobank.com
          FINECO_SUBJECT: Alert da FinecoBank
          FINECO_LABEL: BANCHE
        run: python -m fineco_alert_bridge.runner

      - name: Heartbeat finish
        if: always() && (steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log finish --module FINECO_BRIDGE --component gmail-tradingview-whatsapp --status "${{ job.status }}"
