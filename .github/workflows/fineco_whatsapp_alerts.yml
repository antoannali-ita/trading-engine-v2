name: Fineco WhatsApp Alerts

on:
  workflow_dispatch:
  schedule:
    # LEAN: polling Gmail/Fineco ogni 15 minuti. Rimossi trigger duplicati da altri workflow.
    - cron: '*/15 6-22 * * 1-5'

permissions:
  contents: read

concurrency:
  group: fineco-whatsapp-alerts
  cancel-in-progress: true

jobs:
  fineco-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check Italian market alert window
        id: window
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          DAY=$(TZ=Europe/Rome date +%u)
          if [ "$DAY" -ge 1 ] && [ "$DAY" -le 5 ] && [ "$HOUR" -ge 8 ] && [ "$HOUR" -lt 23 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Dentro fascia Italia: $(TZ=Europe/Rome date)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Fuori fascia Italia: $(TZ=Europe/Rome date)"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Fineco bridge dependencies
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check 'tradingview-screener>=3.0'

      - name: Heartbeat start
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log start --module FINECO_BRIDGE --component gmail-tradingview-whatsapp

      - name: Read Fineco alerts, enrich with TradingView and send WhatsApp
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FINECO_SENDER: service@finecobank.com
          FINECO_SUBJECT: Alert da FinecoBank
          FINECO_LABEL: BANCHE
        run: python -m fineco_alert_bridge.runner

      - name: Heartbeat finish
        if: always() && (steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log finish --module FINECO_BRIDGE --component gmail-tradingview-whatsapp --status "${{ job.status }}"
