name: Dynamic Exit One-Off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dynamic_exit_once.yml'

permissions:
  contents: read

jobs:
  dynamic-exit-now:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/laboratory/src
    steps:
      - name: Checkout strategy lab branch
        uses: actions/checkout@v4
        with:
          ref: strategy-lab-v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: laboratory/requirements.txt

      - name: Install dependencies
        working-directory: laboratory
        run: pip install -r requirements.txt

      - name: Run Dynamic Exit V1 now
        working-directory: laboratory
        env:
          LAB_DYNAMIC_EXIT_ENABLED: '1'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python jobs/run_dynamic_exit.py
