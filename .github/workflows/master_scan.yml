name: Master Scan v2 - PARITY

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        required: true
        type: choice
        options: [usa, italy]
      request_id:
        description: Optional manual_run_requests UUID
        required: false
        type: string
  push:
    paths:
      - '.github/workflows/master_scan.yml'
  schedule:
    - cron: '40 15 * * 1-5'
    - cron: '0 17 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data
          key: v2-core-runtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v2-core-runtime-${{ runner.os }}-
            v2-parity-${{ runner.os }}-
            v2-fast-italy-${{ runner.os }}-
            v2-fast-usa-${{ runner.os }}-
      - run: pytest -q
      - name: Determine market
        id: market
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKET="${{ inputs.market }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            MARKET="usa"
          elif [ "${{ github.event.schedule }}" = "40 15 * * 1-5" ]; then
            MARKET="italy"
          elif [ "${{ github.event.schedule }}" = "0 17 * * 1-5" ]; then
            MARKET="usa"
          else
            exit 1
          fi
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
      - name: Run Master Scan
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL || '35000' }}
          PORTFOLIO_POSITIONS_JSON: ${{ secrets.PORTFOLIO_POSITIONS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MANUAL_REQUEST_ID: ${{ inputs.request_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m monitor.master_scan --market "${{ steps.market.outputs.market }}"
