name: Master Scan v2 - PARITY

on:
  workflow_dispatch:
    inputs:
      market:
        description: Market
        required: true
        type: choice
        options:
          - usa
          - italy
  push:
    paths:
      - '.github/workflows/master_scan.yml'
  schedule:
    - cron: '40 15 * * 1-5'
    - cron: '0 17 * * 1-5'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore / save CORE runtime data
        uses: actions/cache@v4
        with:
          path: data
          key: v2-core-runtime-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v2-core-runtime-${{ runner.os }}-
            v2-parity-${{ runner.os }}-
            v2-fast-italy-${{ runner.os }}-
            v2-fast-usa-${{ runner.os }}-

      - name: Run test suite
        run: pytest -q

      - name: Determine market
        id: market
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKET="${{ inputs.market }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            MARKET="usa"
          elif [ "${{ github.event.schedule }}" = "40 15 * * 1-5" ]; then
            MARKET="italy"
          elif [ "${{ github.event.schedule }}" = "0 17 * * 1-5" ]; then
            MARKET="usa"
          else
            echo "Unable to determine market."
            exit 1
          fi
          echo "market=$MARKET" >> "$GITHUB_OUTPUT"
          echo "Selected market: $MARKET"

      - name: Run Master Scan
        shell: bash
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL || '35000' }}
          PORTFOLIO_POSITIONS_JSON: ${{ secrets.PORTFOLIO_POSITIONS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "Starting MASTER_SCAN for ${{ steps.market.outputs.market }}"
          python -m monitor.master_scan --market "${{ steps.market.outputs.market }}"
          echo "MASTER_SCAN completed."
