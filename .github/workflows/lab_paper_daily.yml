name: Lab Paper Signals

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

jobs:
  paper-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: laboratory
    env:
      LAB_SYMBOLS: "SPY,QQQ,AAPL,MSFT,NVDA,PGR,AXP,CVS,ADBE,NVO"
      LAB_PAPER_SCORE: "75"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: laboratory/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - run: python jobs/run_paper_signals.py
