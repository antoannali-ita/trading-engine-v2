name: Strategy Lab Daily Opportunity Feed (legacy manual)

# Legacy duplicate kept only for manual compatibility.
# The scheduled Laboratory feed is owned by lab_paper_scheduler.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strategy-lab-daily-opportunity-feed
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: laboratory
    env:
      PYTHONPATH: ${{ github.workspace }}/laboratory/src
      LAB_SYMBOLS: "SPY,QQQ,AAPL,MSFT,NVDA,AMZN,GOOGL,META,AVGO,AMD,JPM,GS,AXP,PGR,V,MA,UNH,LLY,NVO,CVS,COST,WMT,HD,CAT,GE,RTX,XOM,CVX,ADBE,CRM,ORCL,NFLX,FTNT,MUFG,TSM,ASML,BKNG,UBER,PANW,LIN"
      LAB_WATCH_SCORE: "55"
      LAB_MAX_POSITION_USD: "5000"
      LAB_MAX_NEW_BUYS: "12"
      LAB_MAX_ACTIVE_POSITIONS: "80"
      LAB_MAX_ACTIVE_PER_STRATEGY: "24"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strategy-lab-v1
      - name: Start Laboratory heartbeat
        run: python ../system_health/run_log.py start --module LAB_PAPER --component daily-opportunity-feed --workflow "${{ github.workflow }}" --message "Strategy Lab V2 manual feed started"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: laboratory/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q tests
      - name: Generate Lab V2 opportunities and paper lifecycle
        run: python jobs/run_paper_signals_v2.py
      - name: Verify stale watchlist cleanup
        run: python jobs/cleanup_watchlist_stale.py
      - name: Enrich V2 metadata, risk identity and Fineco cost scenarios
        run: python jobs/enrich_lab_metadata.py
      - name: Update signal outcomes D1-D60 MFE MAE
        run: python jobs/run_signal_outcomes.py
      - name: Sync fill-based execution and normalized R metrics
        run: python jobs/sync_paper_execution.py
      - name: Build atomic Laboratory 2.2 dashboard snapshots
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python jobs/build_strategy_snapshots.py
      - name: Finish Laboratory heartbeat
        if: always()
        run: python ../system_health/run_log.py finish --module LAB_PAPER --component daily-opportunity-feed --workflow "${{ github.workflow }}" --status "${{ job.status }}" --message "Strategy Lab V2 manual feed finished"
