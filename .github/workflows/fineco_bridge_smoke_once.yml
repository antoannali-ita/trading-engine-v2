name: Fineco Bridge Hardened Smoke Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fineco_bridge_smoke_once.yml"

permissions:
  contents: read

concurrency:
  group: fineco-whatsapp-alerts
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "tradingview-screener>=3.0"
      - name: Run hardened Fineco bridge now
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          FINECO_SENDER: service@finecobank.com
          FINECO_SUBJECT: Alert da FinecoBank
          FINECO_LABEL: BANCHE
        run: python -m fineco_alert_bridge.runner
