name: Strategy Lab Strategy Evolution

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 6"

permissions:
  contents: read

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}/laboratory/src
    steps:
      - name: Checkout strategy lab branch
        uses: actions/checkout@v4
        with:
          ref: strategy-lab-v1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: laboratory/requirements.txt

      - name: Install
        working-directory: laboratory
        run: pip install -r requirements.txt

      - name: Unit tests
        working-directory: laboratory
        run: pytest -q tests

      - name: Run guarded strategy evolution
        working-directory: laboratory
        env:
          LAB_SYMBOLS: "SPY,QQQ,AAPL,MSFT,NVDA,PGR,AXP,CVS,ADBE,NVO"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python jobs/run_strategy_evolution.py
