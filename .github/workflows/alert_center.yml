name: Alert Center

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/alert_center.yml"
      - "alert_center/**"
      - "fineco_alert_bridge/whatsapp.py"
  workflow_run:
    workflows:
      - "Fast Monitor v2"
      - "Trading Engine V2 Orchestrator"
    types: [completed]
  schedule:
    # Primario ogni 10 minuti, sfalsato dai minuti tondi per ridurre ritardi/dropped schedule GitHub.
    - cron: '3,13,23,33,43,53 7-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: alert-center
  cancel-in-progress: true

jobs:
  check-alerts:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Heartbeat start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log start --module ALERT_CENTER --component price-alerts
      - name: Restore cutover alerts, check rules and send WhatsApp
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m alert_center.runner
      - name: Heartbeat finish
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log finish --module ALERT_CENTER --component price-alerts --status "${{ job.status }}"
