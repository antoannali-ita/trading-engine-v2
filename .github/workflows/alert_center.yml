name: Alert Center

on:
  workflow_dispatch:
  schedule:
    # LEAN: alert prezzo ogni 15 minuti. Rimossi trigger duplicati workflow_run/push.
    - cron: '*/15 7-21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: alert-center
  cancel-in-progress: true

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Heartbeat start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log start --module ALERT_CENTER --component price-alerts
      - name: Check Alert Center rules and send WhatsApp only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python -m alert_center.runner
      - name: Heartbeat finish
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m system_health.run_log finish --module ALERT_CENTER --component price-alerts --status "${{ job.status }}"
