name: Export Laboratory Data

on:
  workflow_dispatch:
  schedule:
    # Laboratory audit 3x/week. 18:30 UTC = 20:30 Italy in summer, 19:30 in winter.
    # Mon/Wed/Fri gives a regular 2-3 day cadence without month-boundary quirks.
    - cron: '30 18 * * 1,3,5'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Supabase Laboratory tables
        run: python scripts/export_lab_data.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Build Laboratory session health report
        run: python scripts/lab_health_report.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Show export manifest and health report
        if: always()
        run: |
          find artifacts -name manifest.json -print -exec cat {} \; || true
          find artifacts -name LAB_HEALTH_REPORT.md -print -exec cat {} \; || true

      - name: Upload Laboratory audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laboratory-data-export
          path: |
            artifacts/lab_export_*.zip
            artifacts/lab_export_*/manifest.json
            artifacts/lab_health_*/lab_health_report.json
            artifacts/lab_health_*/LAB_HEALTH_REPORT.md
            artifacts/lab_health_*/strategy_summary.csv
            artifacts/lab_health_*/gate_failures.csv
            artifacts/lab_health_*/signals_latest_session.csv
          if-no-files-found: error
          retention-days: 30
