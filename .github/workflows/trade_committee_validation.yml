name: Trade Committee Validation

on:
  pull_request:
    paths:
      - 'trade_committee/**'
      - 'pages/5_Trade_Committee.py'
      - 'dashboard/pages/5_Trade_Committee.py'
      - 'tests/test_trade_committee*.py'
      - 'requirements.txt'
      - 'docs/TRADE_COMMITTEE.md'
      - 'docs/research/TRADE_COMMITTEE_*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Trade Committee tests
        run: pytest -q tests/test_trade_committee.py tests/test_trade_committee_v2_checks.py tests/test_trade_committee_persistence.py
      - name: Compile Trade Committee modules
        run: python -m py_compile trade_committee/*.py pages/5_Trade_Committee.py dashboard/pages/5_Trade_Committee.py
